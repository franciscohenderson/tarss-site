<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EVA · Asistente flotante</title>
<style>
  /* =====================================================================
     Página de demostración: fondo oscuro y un poco de contenido con
     botones, para comprobar que EVA nunca tapa ni entorpece los clics.
     ===================================================================== */
  :root {
    --fondo: #0d1117;
    --texto: #e6edf3;
    --tenue: #8b949e;
    --azul: #4fd8ff;          /* color de los ojos */
    --azul-glow: #00a2ff;     /* halo del neón */
    --blanco-eva: #f7f9fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(80% 60% at 50% 0%, #1b2433, var(--fondo) 70%);
    color: var(--texto);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  main { max-width: 760px; margin: 0 auto; padding: 80px 24px; }
  h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.02em; }
  p { margin-top: 16px; color: var(--tenue); }
  .botones { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  button {
    padding: 12px 20px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--azul); color: #04121a; font: 700 15px system-ui, sans-serif;
  }
  button.secundario { background: transparent; color: var(--texto); box-shadow: inset 0 0 0 1.5px #30363d; }
  #registro { margin-top: 18px; min-height: 1.6em; color: var(--azul); font-weight: 600; }
  .solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* =====================================================================
     EVA: contenedor general.
     - position: fixed → se ubica respecto del viewport, no de la página.
     - left/top apuntan al CENTRO del robot (por eso el translate -50%).
     - Las transiciones de left/top/transform hacen que los movimientos
       que decide JavaScript se vean fluidos y no a saltos.
     ===================================================================== */
  .eva {
    position: fixed;
    left: 80vw;
    top: 70vh;
    z-index: 1000;
    width: 90px;
    height: 170px;
    transform: translate(-50%, -50%) rotate(var(--giro, 0deg));
    transition:
      left 700ms cubic-bezier(.22, 1, .36, 1),
      top 700ms cubic-bezier(.22, 1, .36, 1),
      transform 500ms cubic-bezier(.22, 1, .36, 1);
    cursor: default;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Al huir, los movimientos son mucho más rápidos (se «asusta»). */
  .eva.huyendo {
    transition:
      left 260ms cubic-bezier(.3, 1.4, .5, 1),
      top 260ms cubic-bezier(.3, 1.4, .5, 1),
      transform 260ms ease-out;
  }
  /* Mientras huye no recibe el puntero: el clic pasa a lo que haya debajo. */
  .eva.intocable { pointer-events: none; }

  /* ---------- Cabeza: separada del cuerpo (levitación magnética) ---------- */
  .eva__cabeza {
    position: absolute;
    left: 50%;
    top: 0;
    width: 82px;
    height: 56px;
    margin-left: -41px;
    border-radius: 50% 50% 46% 46% / 62% 62% 40% 40%;
    background: radial-gradient(120% 90% at 35% 25%, #ffffff, var(--blanco-eva) 45%, #d9e1e8 100%);
    box-shadow: inset -6px -8px 14px rgb(0 0 0 / .12), 0 6px 14px rgb(0 0 0 / .35);
    animation: flotar-cabeza 3.1s ease-in-out infinite;
    animation-delay: -0.45s;   /* desfasada respecto del cuerpo */
  }
  /* Pantalla negra (el visor de EVA) */
  .eva__pantalla {
    position: absolute;
    inset: 12px 9px 11px;
    border-radius: 50% / 60%;
    background: radial-gradient(90% 90% at 40% 30%, #1c2129, #04060a 70%);
    box-shadow: inset 0 2px 6px rgb(0 0 0 / .8);
    overflow: hidden;
  }
  /* Los ojos: se mueven un poco hacia el cursor (variables --mx / --my) */
  .eva__ojos {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    transform: translate(var(--mx, 0px), var(--my, 0px));
    transition: transform 250ms ease-out;
  }
  .eva__ojo {
    width: 17px;
    height: 10px;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: var(--azul);
    /* Efecto neón: varias sombras del mismo color, cada vez más difusas */
    box-shadow:
      0 0 3px var(--azul),
      0 0 8px var(--azul-glow),
      0 0 16px var(--azul-glow),
      0 0 26px rgb(0 162 255 / .6);
    animation: parpadear 5.2s infinite;
  }
  .eva__ojo:first-child { rotate: -8deg; }
  .eva__ojo:last-child  { rotate: 8deg; }

  /* ---------- Cuerpo: blanco, ovalado, más angosto abajo ---------- */
  .eva__cuerpo {
    position: absolute;
    left: 50%;
    top: 66px;                 /* deja ~10 px de aire entre cabeza y cuerpo */
    width: 70px;
    height: 92px;
    margin-left: -35px;
    border-radius: 50% 50% 46% 46% / 40% 40% 60% 60%;
    background: radial-gradient(110% 80% at 30% 20%, #ffffff, var(--blanco-eva) 40%, #cfd8e0 100%);
    box-shadow: inset -8px -10px 18px rgb(0 0 0 / .14), 0 10px 22px rgb(0 0 0 / .35);
    animation: flotar-cuerpo 3.4s ease-in-out infinite;
  }
  /* Brazos: pegados al cuerpo, como aletas */
  .eva__cuerpo::before,
  .eva__cuerpo::after {
    content: "";
    position: absolute;
    top: 14px;
    width: 14px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(90deg, #e9eef2, #c9d2da);
  }
  .eva__cuerpo::before { left: -9px;  transform: rotate(10deg); }
  .eva__cuerpo::after  { right: -9px; transform: rotate(-10deg); }

  /* ---------- Sombra en el suelo ---------- */
  .eva__sombra {
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 64px;
    height: 12px;
    margin-left: -32px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgb(0 0 0 / .55), rgb(0 0 0 / 0));
    animation: sombra 3.4s ease-in-out infinite;   /* misma duración que el cuerpo */
  }

  /* ---------- Globo de diálogo (estilo cómic) ---------- */
  .eva__globo {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    width: max-content;
    white-space: nowrap;
    padding: 12px 16px;
    border: 2.5px solid #0d1117;
    border-radius: 18px;
    background: #ffffff;
    color: #0d1117;
    font: 700 15px/1.3 system-ui, sans-serif;
    box-shadow: 4px 4px 0 #0d1117;
    /* Oculto por defecto: invisible, chico y SIN transición (desaparece al instante) */
    opacity: 0;
    transform: translateX(calc(-50% + var(--gx, 0px))) scale(.6);
    transform-origin: 50% 120%;
    pointer-events: none;
    transition: none;
  }
  /* Colita del globo */
  .eva__globo::after {
    content: "";
    position: absolute;
    left: calc(50% - var(--gx, 0px));   /* la colita sigue apuntando a EVA */
    top: 100%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    background: #ffffff;
    border-right: 2.5px solid #0d1117;
    border-bottom: 2.5px solid #0d1117;
    transform: rotate(45deg);
  }
  /* Si EVA está cerca del borde superior, el globo va abajo */
  .eva.globo-abajo .eva__globo { bottom: auto; top: calc(100% + 14px); transform-origin: 50% -20%; }
  .eva.globo-abajo .eva__globo::after { top: 0; transform: rotate(225deg); }
  /* Visible: aparece suave (opacidad + escala con un pequeño rebote) */
  .eva.hablando .eva__globo {
    opacity: 1;
    transform: translateX(calc(-50% + var(--gx, 0px))) scale(1);
    transition: opacity 260ms ease-out, transform 420ms cubic-bezier(.34, 1.56, .64, 1);
  }

  /* =====================================================================
     Animaciones pasivas
     ===================================================================== */
  /* Levitación del cuerpo: sube y baja 10 px */
  @keyframes flotar-cuerpo {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  /* La cabeza flota un poco más y con otra duración (3,1 s contra 3,4 s):
     el vaivén entre las dos piezas cambia todo el tiempo y parece
     magnético, no una sola pieza rígida. */
  @keyframes flotar-cabeza {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-13px) rotate(1.5deg); }
  }
  /* Sombra: cuando el cuerpo sube (50 %), la sombra se achica y se aclara */
  @keyframes sombra {
    0%, 100% { transform: scaleX(1);   opacity: .9; }
    50%      { transform: scaleX(.72); opacity: .45; }
  }
  /* Parpadeo: los ojos se aplastan verticalmente durante un instante.
     Ocupa solo el ~4 % del ciclo, así parece ocasional. */
  @keyframes parpadear {
    0%, 92%, 100% { scale: 1 1; }
    94%           { scale: 1 .1; }
    96%           { scale: 1 1; }
  }

  /* Respeta a quien pidió menos movimiento en su sistema */
  @media (prefers-reduced-motion: reduce) {
    .eva__cabeza, .eva__cuerpo, .eva__sombra { animation: none; }
    .eva, .eva.huyendo { transition-duration: 1ms; }
  }
</style>
</head>
<body>

<main>
  <h1>Hola, soy una página cualquiera.</h1>
  <p>EVA te sigue a una distancia prudente. Si te acercás rápido, se asusta y se va. Si te quedás quieto 3 segundos, se asoma a preguntarte si te puede ayudar.</p>
  <p>Probá: los botones de abajo funcionan siempre, EVA nunca se mete en el medio.</p>
  <div class="botones">
    <button type="button" data-msg="Clic en «Comprar». EVA no molestó.">Comprar</button>
    <button type="button" class="secundario" data-msg="Clic en «Ver más». Todo bien.">Ver más</button>
    <button type="button" class="secundario" data-msg="Clic en «Contacto». Sin interferencias.">Contacto</button>
  </div>
  <p id="registro" aria-live="polite"></p>
</main>

<!-- EVA es decorativa (aria-hidden); lo que dice se anuncia en #eva-voz -->
<div class="eva" id="eva" aria-hidden="true">
  <div class="eva__globo">¿Te puedo ayudar en algo?</div>
  <div class="eva__cabeza">
    <div class="eva__pantalla">
      <div class="eva__ojos"><span class="eva__ojo"></span><span class="eva__ojo"></span></div>
    </div>
  </div>
  <div class="eva__cuerpo"></div>
  <div class="eva__sombra"></div>
</div>
<p id="eva-voz" class="solo-lector" aria-live="polite"></p>

<script>
(() => {
  'use strict';

  const eva  = document.getElementById('eva');
  const ojos = eva.querySelector('.eva__ojos');
  const voz  = document.getElementById('eva-voz');
  const globo = eva.querySelector('.eva__globo');

  /* ------------------------------------------------------------------
     Parámetros (en píxeles y milisegundos)
     ------------------------------------------------------------------ */
  const DIST_MIN      = 100;  // más cerca que esto, EVA se aleja
  const DIST_MAX      = 150;  // más lejos que esto, EVA se acerca
  const DIST_IDEAL    = 125;  // punto medio del «margen de respeto»
  const ZONA_SUSTO    = 90;   // si el cursor entra acá...
  const VEL_SUSTO     = 1.2;  // ...a más de 1,2 px/ms (≈1200 px/s), huye
  const DIST_HUIDA    = 260;  // al huir, termina al menos a esta distancia del cursor
  const MARGEN_BORDE  = 70;   // EVA nunca se acerca a menos de esto del borde
  const ESPERA_QUIETO = 3000; // 3 s sin mover el mouse → se asoma y habla
  const GIRO_MAX      = 14;   // grados máximos de inclinación al «asomarse»

  /* Estado: dónde está EVA (su centro) y el cursor */
  let evaX = innerWidth * 0.8;
  let evaY = innerHeight * 0.7;
  let ultimoMouse = null;            // { x, y, t } del último mousemove
  let temporizadorQuieto = null;     // setTimeout de inactividad
  let huyendoHasta = 0;              // instante (ms) en que termina la huida

  /* Mantiene un punto dentro de la pantalla, con un margen para que EVA
     (que mide ~90×170 px) nunca quede cortada por el borde. */
  function limitarAlViewport(x, y) {
    return {
      x: Math.min(Math.max(x, MARGEN_BORDE), innerWidth  - MARGEN_BORDE),
      y: Math.min(Math.max(y, MARGEN_BORDE + 40), innerHeight - MARGEN_BORDE - 40),
    };
  }

  /* Coloca a EVA: escribe left/top (las transiciones CSS lo suavizan) */
  function moverA(x, y) {
    const p = limitarAlViewport(x, y);
    evaX = p.x;
    evaY = p.y;
    eva.style.left = evaX + 'px';
    eva.style.top  = evaY + 'px';
    // Si quedó cerca del borde superior, el globo se dibuja abajo
    eva.classList.toggle('globo-abajo', evaY < 170);
  }

  /* ------------------------------------------------------------------
     1) Seguimiento con margen de respeto
     ------------------------------------------------------------------
     Tomamos el vector que va DEL CURSOR A EVA:
         dx = evaX - mouseX
         dy = evaY - mouseY
     Su largo es la distancia entre los dos, por Pitágoras (la hipotenusa
     del triángulo rectángulo de catetos dx y dy):
         distancia = √(dx² + dy²)      → Math.hypot(dx, dy)
     Si la distancia está fuera del rango [DIST_MIN, DIST_MAX], llevamos
     a EVA sobre ESE MISMO vector, pero a DIST_IDEAL del cursor:
         destino = cursor + (dx, dy) / distancia × DIST_IDEAL
     Dividir por la distancia da un vector de largo 1 («unitario») que
     conserva solo la dirección; multiplicarlo por DIST_IDEAL lo estira
     al largo que queremos. Así EVA se acerca o se aleja en línea recta,
     del lado donde ya estaba, y nunca queda debajo del puntero. */
  function seguir(mx, my) {
    let dx = evaX - mx;
    let dy = evaY - my;
    let distancia = Math.hypot(dx, dy);

    // Caso borde: cursor exactamente sobre EVA (distancia 0) → no hay
    // dirección; elegimos un ángulo al azar para poder separarnos.
    if (distancia < 0.001) {
      const a = Math.random() * Math.PI * 2;
      dx = Math.cos(a); dy = Math.sin(a); distancia = 1;
    }

    if (distancia >= DIST_MIN && distancia <= DIST_MAX) return; // ya está cómoda

    const ux = dx / distancia;  // vector unitario (dirección cursor → EVA)
    const uy = dy / distancia;
    let destinoX = mx + ux * DIST_IDEAL;
    let destinoY = my + uy * DIST_IDEAL;

    // Si el destino cae fuera de la pantalla, al limitarlo podría quedar
    // demasiado cerca del cursor. En ese caso usamos el lado opuesto
    // (el mismo vector, con signo invertido).
    const p = limitarAlViewport(destinoX, destinoY);
    if (Math.hypot(p.x - mx, p.y - my) < DIST_MIN) {
      destinoX = mx - ux * DIST_IDEAL;
      destinoY = my - uy * DIST_IDEAL;
    }
    moverA(destinoX, destinoY);
  }

  /* ------------------------------------------------------------------
     2) Ojos que miran al cursor
     ------------------------------------------------------------------
     El ángulo del vector EVA → cursor se obtiene con atan2(dy, dx), que
     devuelve el ángulo en radianes teniendo en cuenta el cuadrante (a
     diferencia de atan(dy / dx), que confunde izquierda con derecha).
     Con coseno y seno de ese ángulo corremos los ojos hasta 5 px en
     horizontal y 3 px en vertical, en esa dirección. */
  function mirar(mx, my) {
    const angulo = Math.atan2(my - evaY, mx - evaX);
    ojos.style.setProperty('--mx', (Math.cos(angulo) * 5).toFixed(1) + 'px');
    ojos.style.setProperty('--my', (Math.sin(angulo) * 3).toFixed(1) + 'px');
  }

  /* ------------------------------------------------------------------
     3) Evasión: no se deja pinchar
     ------------------------------------------------------------------
     Elegimos una coordenada aleatoria dentro del viewport (respetando
     el margen), pero solo la aceptamos si queda a más de DIST_HUIDA del
     cursor (otra vez la hipotenusa). Probamos hasta 20 veces; si ninguna
     sirve (pantallas muy chicas), usamos la esquina opuesta al cursor.
     Durante la huida EVA es «intocable» (pointer-events: none): si el
     usuario hace clic justo ahí, el clic llega a lo que está debajo. */
  function huir(mx, my) {
    let destino = null;
    for (let i = 0; i < 20 && !destino; i++) {
      const x = MARGEN_BORDE + Math.random() * (innerWidth  - 2 * MARGEN_BORDE);
      const y = MARGEN_BORDE + 40 + Math.random() * (innerHeight - 2 * (MARGEN_BORDE + 40));
      if (Math.hypot(x - mx, y - my) > DIST_HUIDA) destino = { x, y };
    }
    if (!destino) {
      destino = {
        x: mx < innerWidth / 2  ? innerWidth  - MARGEN_BORDE : MARGEN_BORDE,
        y: my < innerHeight / 2 ? innerHeight - MARGEN_BORDE : MARGEN_BORDE,
      };
    }
    callar();
    eva.classList.add('huyendo', 'intocable');
    eva.style.setProperty('--giro', (Math.random() < 0.5 ? -1 : 1) * 18 + 'deg'); // sacudón de susto
    moverA(destino.x, destino.y);
    huyendoHasta = performance.now() + 320;
    setTimeout(() => {
      eva.classList.remove('huyendo', 'intocable');
      eva.style.setProperty('--giro', '0deg');
    }, 320);
  }

  /* ------------------------------------------------------------------
     4) Inactividad: se asoma y habla
     ------------------------------------------------------------------
     A los 3 s sin movimiento, EVA se inclina hacia el cursor. Usamos
     dx / distancia, que es el coseno del ángulo hacia el cursor: vale -1
     si el cursor está justo a la izquierda y 1 si está justo a la
     derecha. Multiplicado por GIRO_MAX da una inclinación proporcional,
     con tope en ±14°. */
  function asomarse() {
    if (!ultimoMouse) return;
    const dx = ultimoMouse.x - evaX;
    const dy = ultimoMouse.y - evaY;
    const distancia = Math.hypot(dx, dy) || 1;
    const giro = (dx / distancia) * GIRO_MAX;
    eva.style.setProperty('--giro', giro.toFixed(1) + 'deg');
    /* Que el globo no se salga de la pantalla: su ancho w está centrado en
       evaX, así que ocupa de evaX - w/2 a evaX + w/2. Si se pasa de un
       borde (con 8 px de aire), lo corremos lo justo hacia adentro. */
    const w = globo.offsetWidth;
    const izquierda = evaX - w / 2;
    const derecha = evaX + w / 2;
    let corrimiento = 0;
    if (izquierda < 8) corrimiento = 8 - izquierda;
    else if (derecha > innerWidth - 8) corrimiento = innerWidth - 8 - derecha;
    globo.style.setProperty('--gx', corrimiento.toFixed(0) + 'px');
    eva.classList.add('hablando');
    voz.textContent = '¿Te puedo ayudar en algo?';
  }

  /* Oculta el globo al instante (sin transición) y endereza a EVA */
  function callar() {
    eva.classList.remove('hablando');
    eva.style.setProperty('--giro', '0deg');
    voz.textContent = '';
  }

  function reiniciarEspera() {
    clearTimeout(temporizadorQuieto);
    temporizadorQuieto = setTimeout(asomarse, ESPERA_QUIETO);
  }

  /* ------------------------------------------------------------------
     Evento principal: movimiento del mouse
     ------------------------------------------------------------------ */
  addEventListener('mousemove', (e) => {
    const ahora = performance.now();
    const mx = e.clientX;
    const my = e.clientY;

    // Velocidad del cursor = distancia recorrida / tiempo transcurrido.
    // La distancia recorrida es otra hipotenusa: entre la posición
    // anterior del cursor y la actual.
    let velocidad = 0;
    if (ultimoMouse) {
      const dt = Math.max(ahora - ultimoMouse.t, 1);  // evita dividir por 0
      velocidad = Math.hypot(mx - ultimoMouse.x, my - ultimoMouse.y) / dt; // px/ms
    }
    ultimoMouse = { x: mx, y: my, t: ahora };

    // Cualquier movimiento corta el diálogo al instante
    if (eva.classList.contains('hablando')) callar();
    reiniciarEspera();

    // Mientras huye, no recalculamos nada (dejamos que termine la huida)
    if (ahora < huyendoHasta) return;

    const distancia = Math.hypot(evaX - mx, evaY - my);
    // Invasión rápida del margen de seguridad → susto y huida
    if (distancia < ZONA_SUSTO && velocidad > VEL_SUSTO) {
      huir(mx, my);
      return;
    }
    // Si igual quedó demasiado encima (llegó despacio), también se va
    if (distancia < DIST_MIN * 0.55) {
      huir(mx, my);
      return;
    }

    seguir(mx, my);
    mirar(mx, my);
  }, { passive: true });

  /* Cinturón de seguridad: si el puntero logra tocarla, huye antes de
     cualquier clic (mouseenter llega antes que pointerdown y click). */
  eva.addEventListener('mouseenter', (e) => huir(e.clientX, e.clientY));
  eva.addEventListener('pointerdown', (e) => { e.preventDefault(); huir(e.clientX, e.clientY); });

  /* Si cambia el tamaño de la ventana, EVA vuelve a entrar en la pantalla */
  addEventListener('resize', () => moverA(evaX, evaY));

  /* Botones de la demo: muestran que los clics llegan siempre */
  const registro = document.getElementById('registro');
  document.querySelectorAll('[data-msg]').forEach((b) =>
    b.addEventListener('click', () => { registro.textContent = b.dataset.msg; }));

  // Posición inicial. En celulares (sin mouse) también se asoma a los 3 s.
  moverA(evaX, evaY);
  setTimeout(() => {
    if (!ultimoMouse) {
      ultimoMouse = { x: innerWidth / 2, y: innerHeight / 2, t: 0 };
      asomarse();
    }
  }, ESPERA_QUIETO);
})();
</script>
</body>
</html>
